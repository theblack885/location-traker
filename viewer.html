<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Location Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  html,body{margin:0;background:#070712;font-family:-apple-system,Segoe UI,Roboto,sans-serif;height:100%;overflow:hidden;color:#fff}

  #setup{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#070712; z-index:20; padding:24px;
  }
  #setup h1{font-size:24px;margin-bottom:6px;background:linear-gradient(90deg,#4FD1FF,#8B5CF6);-webkit-background-clip:text;background-clip:text;color:transparent}
  #setup p{color:rgba(255,255,255,0.55);font-size:13px;margin-bottom:22px;text-align:center}
  #roomInput{
    width:100%;max-width:280px;padding:14px 16px;border-radius:16px;
    border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);
    color:#fff;font-size:16px;text-align:center;letter-spacing:4px;margin-bottom:16px;outline:none;
  }
  #roomInput:focus{border-color:#4FD1FF}
  #connectBtn{
    padding:12px 36px;border-radius:20px;border:none;
    background:linear-gradient(90deg,#4FD1FF,#8B5CF6);color:#fff;font-weight:700;font-size:14px;
    cursor:pointer;
  }

  #map{position:absolute;inset:0;filter:saturate(0.9)}
  #card{
    position:absolute;left:14px;right:14px;bottom:14px;z-index:10;
    background:rgba(19,15,43,0.85);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.12);border-radius:22px;
    padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,0.4);
    display:none;
  }
  #status{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  #dot{width:9px;height:9px;border-radius:50%;background:#34E39B;box-shadow:0 0 10px #34E39B;animation:blink 1.6s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
  #addr{font-size:14.5px;line-height:1.4;font-weight:600}
  #coords{font-size:12.5px;color:#4FD1FF;margin-top:8px;font-weight:600}
  #time{font-size:11.5px;color:rgba(255,255,255,0.45);margin-top:5px}
  #changeRoom{
    position:absolute;top:14px;right:14px;z-index:10;
    background:rgba(19,15,43,0.85);border:1px solid rgba(255,255,255,0.15);
    color:#fff;padding:8px 14px;border-radius:14px;font-size:12px;cursor:pointer;
  }
  .leaflet-control-attribution{font-size:9px;background:rgba(7,7,18,0.6)!important;color:#888!important}
  .leaflet-control-zoom a{background:rgba(19,15,43,0.85)!important;color:#fff!important;border:1px solid rgba(255,255,255,0.12)!important}
</style>
</head>
<body>

<div id="setup">
  <h1>Location Tracker</h1>
  <p>Jis phone ki location dekhni hai, uska room code daalo</p>
  <input id="roomInput" maxlength="4" placeholder="jaise 1234" inputmode="numeric">
  <button id="connectBtn">Connect karo</button>
</div>

<div id="map"></div>
<button id="changeRoom" style="display:none">Room badlo</button>
<div id="card">
  <div id="status"><div id="dot"></div><span style="font-size:11.5px;color:rgba(255,255,255,0.6);font-weight:700;letter-spacing:0.5px;text-transform:uppercase">Live</span></div>
  <div id="addr">Location dhundi ja rahi hai...</div>
  <div id="coords"></div>
  <div id="time"></div>
</div>

<script>
const SERVER_HOST = "traker-mi1p.onrender.com";
let map = null, marker = null, lastKey = "", pollTimer = null;

const pulseIcon = L.divIcon({
  className: '',
  html: '<div style="width:18px;height:18px;border-radius:50%;background:#4FD1FF;border:3px solid #fff;box-shadow:0 0 16px #4FD1FF"></div>',
  iconSize: [18,18], iconAnchor: [9,9]
});

function initMap() {
  if (map) return;
  map = L.map('map', {zoomControl:true}).setView([20.5937,78.9629], 4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap, &copy; CARTO',
      subdomains: 'abcd', maxZoom: 19
  }).addTo(map);
}

function reverseGeocode(lat, lng) {
  const key = lat.toFixed(4) + "," + lng.toFixed(4);
  if (key === lastKey) return;
  lastKey = key;
  fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng)
    .then(r => r.json())
    .then(d => { document.getElementById('addr').innerText = d.display_name || "Pata nahi mil paya"; })
    .catch(() => { document.getElementById('addr').innerText = "Pata load nahi ho paya"; });
}

function poll(room) {
  fetch('https://' + SERVER_HOST + '/location/' + room)
    .then(r => r.json())
    .then(d => {
      if (d && d.lat) {
        document.getElementById('card').style.display = 'block';
        const pos = [d.lat, d.lng];
        if (!marker) { marker = L.marker(pos, {icon: pulseIcon}).addTo(map); map.setView(pos, 16); }
        else { marker.setLatLng(pos); }
        reverseGeocode(d.lat, d.lng);
        document.getElementById('coords').innerText = "GPS  " + d.lat.toFixed(6) + ", " + d.lng.toFixed(6);
        const dt = new Date(d.time);
        document.getElementById('time').innerText = "Last update " + dt.toLocaleTimeString();
      }
    }).catch(() => {});
}

document.getElementById('connectBtn').onclick = () => {
  const room = document.getElementById('roomInput').value.trim();
  if (room.length < 1) return;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('changeRoom').style.display = 'block';
  initMap();
  if (pollTimer) clearInterval(pollTimer);
  poll(room);
  pollTimer = setInterval(() => poll(room), 5000);
};

document.getElementById('changeRoom').onclick = () => {
  if (pollTimer) clearInterval(pollTimer);
  document.getElementById('card').style.display = 'none';
  document.getElementById('setup').style.display = 'flex';
};
</script>
</body>
</html>
